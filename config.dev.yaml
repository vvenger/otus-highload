app:
  name: social-network
  shutdown_timeout_sec: 5
  web:
    port: 8000
    read_timeout_sec: 600
    write_timeout_sec: 600
    retry_after_sec: 5
  token:
    secret: secret
    expire_sec: 43200

log:
  level: info
  format: json

db:
  master:
    host: haproxy
    port: 5432
    database: main
    user: root
    password: root
    max_conns: 8
    min_conns: 4
    exec_mode: MODE_EXEC
  replica:
    host: haproxy
    port: 5433
    max_conns: 20
    min_conns: 4
    exec_mode: MODE_EXEC

otlp:
  metrics_port: 4318
  traces_url: http://localhost:4317
  traces_enabled: false

redis:
  host: localhost
  port: 6379
