user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    # upstream_addr показывает, какой инстанс обработал запрос (evidence балансировки).
    log_format  balanced  '$remote_addr -> $upstream_addr "$request" '
                          '$status ${request_time}s';
    access_log  /var/log/nginx/access.log  balanced;
    error_log   /var/log/nginx/error.log  warn;

    # Встроенный DNS Docker: имя сервиса `app` на каждый запрос резолвится в
    # один из живых инстансов (Docker DNS отдаёт по одному IP за раз,
    # round-robin между ответами). valid=5s — TTL кэша резолва в nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location / {

            set $app_service app;
            proxy_pass http://$app_service:8000;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Быстрый отказ мёртвого инстанса и повтор запроса на следующем.
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
