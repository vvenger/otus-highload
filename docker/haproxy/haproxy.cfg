global
    maxconn 1000
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    retries 3

# Stats UI
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node
    stats show-legends

# Primary (read-write) - routes to current Patroni leader
listen postgres_primary
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-1 patroni-1:5432 maxconn 100 check port 8008
    server patroni-2 patroni-2:5432 maxconn 100 check port 8008
    server patroni-3 patroni-3:5432 maxconn 100 check port 8008

# Replicas (read-only, round-robin) - routes to Patroni replicas
listen postgres_replicas
    bind *:5433
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-1 patroni-1:5432 maxconn 100 check port 8008
    server patroni-2 patroni-2:5432 maxconn 100 check port 8008
    server patroni-3 patroni-3:5432 maxconn 100 check port 8008
