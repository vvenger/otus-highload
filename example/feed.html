<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; color: #222; }

    .login-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 16px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    .login-bar input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      width: 220px;
    }
    .login-bar button {
      padding: 8px 16px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    .login-bar button:hover { background: #357abd; }

    #status {
      text-align: center;
      padding: 8px;
      font-size: 13px;
      color: #666;
    }
    #status.error { color: #c0392b; }
    #status.ok    { color: #27ae60; }

    #feed {
      max-width: 600px;
      margin: 24px auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .post {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px 16px;
    }
    .post .meta {
      font-size: 12px;
      color: #999;
      margin-bottom: 6px;
    }
    .post .text { font-size: 15px; line-height: 1.5; }
    .post.new { border-left: 3px solid #4a90e2; }
  </style>
</head>
<body>

<div class="login-bar">
  <input id="userId" type="text" placeholder="User ID" />
  <input id="password" type="password" placeholder="Password" />
  <button onclick="login()">Войти</button>
</div>

<div id="status">Введите ID пользователя и пароль</div>
<div id="feed"></div>

<script>
  const API  = '';
  const WS   = 'ws://localhost:8002';

  let token = null;
  let ws    = null;

  async function login() {
    const id  = document.getElementById('userId').value.trim();
    const pwd = document.getElementById('password').value.trim();
    if (!id || !pwd) return setStatus('Заполните ID и пароль', 'error');

    try {
      const res = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, password: pwd }),
      });
      if (!res.ok) return setStatus('Ошибка входа: ' + res.status, 'error');

      const data = await res.json();
      token = data.token;

      connectWS();
    } catch (e) {
      setStatus('Ошибка: ' + e.message, 'error');
    }
  }

  function connectWS() {
    if (ws) ws.close();

    ws = new WebSocket(`${WS}/post/feed/posted`);

    ws.onopen = () => {
      // Первым сообщением отправляем токен для авторизации
      ws.send(token);
      setStatus('Подключено. Ожидаем новые посты…', 'ok');
    };
    ws.onclose   = () => setStatus('WebSocket отключён', 'error');
    ws.onerror   = () => setStatus('WebSocket ошибка', 'error');
    ws.onmessage = (e) => {
      try {
        const event = JSON.parse(e.data);
        prependPost({
          id:         event.postId,
          text:       event.postText,
          author_id:  event.author_user_id,
          created_at: new Date().toISOString(),
        }, true);
      } catch (_) {}
    };
  }

  function prependPost(p, isNew) {
    const feed = document.getElementById('feed');
    feed.insertBefore(makePost(p, isNew), feed.firstChild);
  }

  function makePost(p, isNew) {
    const div = document.createElement('div');
    div.className = 'post' + (isNew ? ' new' : '');
    div.innerHTML = `
      <div class="meta">
        автор: ${p.author_id} &nbsp;·&nbsp; ${formatDate(p.created_at)}
      </div>
      <div class="text">${escapeHtml(p.text)}</div>
    `;
    return div;
  }

  function setStatus(msg, cls) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className   = cls || '';
  }

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleString('ru-RU');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
</script>
</body>
</html>
